<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>EBOM 2026 — Relatório de inscritos</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="hero" style="padding-bottom:60px">
  <img class="logo" src="assets/logo-ad.png" alt="Assembleia de Deus Brás Valparaíso" style="height:70px">
  <div class="igreja">Área da organização</div>
  <h1 style="font-size:2.4rem">EBOM · Inscritos</h1>
</header>

<main class="wide">
  <section class="card" id="login" style="max-width:420px;margin-left:auto;margin-right:auto">
    <h2>Acesso restrito</h2>
    <p class="lead">Digite a senha da organização.</p>
    <input id="chave" type="password" placeholder="Senha" autocomplete="current-password">
    <div class="alerta erro hidden" id="erro"></div>
    <button class="btn" id="entrar">Entrar</button>
  </section>

  <section class="card hidden" id="painel">
    <div class="alerta demo hidden" id="demo" style="margin:0 0 14px">Modo demonstração: mostrando apenas inscrições feitas neste aparelho.</div>
    <div class="kpis" id="kpis"></div>
    <div class="barra">
      <input id="busca" placeholder="Buscar por nome, CPF, cidade ou protocolo">
      <button class="btn ouro" id="bXlsx">⬇ Excel (.xlsx)</button>
      <button class="btn" id="bPdf">⬇ PDF</button>
      <button class="btn claro" id="bAtualizar">↻ Atualizar</button>
    </div>
    <div class="tabela"><table>
      <thead><tr><th>Nº</th><th>Protocolo</th><th>Nome completo</th><th>CPF</th><th>Nascimento</th><th>Cidade</th><th>Inscrito em</th></tr></thead>
      <tbody id="corpo"></tbody>
    </table></div>
    <p class="dica" id="vazio"></p>
  </section>
</main>
<footer><a href="index.html">← Voltar à inscrição</a></footer>

<script src="config.js"></script>
<script src="common.js"></script>
<script>
(function(){
  const $=(i)=>document.getElementById(i), X=window.EBOM;
  let dados=[];
  const esc=(s)=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

  async function carregar(chave){
    const r = await X.Api.call({acao:'listar', chave});
    if(!r.ok) throw new Error(r.erro||'Senha incorreta.');
    dados = (r.registros||[]).sort((a,b)=>String(a.criadoEm).localeCompare(b.criadoEm));
    $('demo').classList.toggle('hidden', !X.Api.demo);
    render();
  }
  function render(){
    const q = X.limpa($('busca').value).toLowerCase(), qd = X.onlyDigits(q);
    const lista = dados.filter(r=>!q || (r.nome+' '+r.cidade+' '+r.protocolo).toLowerCase().includes(q) || (qd && r.cpf.includes(qd)));
    const cid = X.resumoCidades(dados);
    $('kpis').innerHTML = `<div class="kpi"><b>${dados.length}</b><span>Total de inscritos</span></div>
      <div class="kpi"><b>${cid.length}</b><span>Cidades</span></div>
      <div class="kpi"><b>${cid[0]?esc(cid[0][0]):'—'}</b><span>Cidade com mais inscritos${cid[0]?` (${cid[0][1]})`:''}</span></div>`;
    $('corpo').innerHTML = lista.map((r,i)=>`<tr><td>${dados.indexOf(r)+1}</td><td>${esc(r.protocolo)}</td><td>${esc(r.nome)}</td><td>${X.fmtCpf(r.cpf)}</td><td>${X.fmtData(r.nascimento)}</td><td>${esc(r.cidade)}</td><td>${X.fmtDataHora(r.criadoEm)}</td></tr>`).join('');
    $('vazio').textContent = lista.length ? '' : (dados.length ? 'Nenhum resultado para a busca.' : 'Ainda não há inscritos.');
  }
  async function entrar(){
    const chave = $('chave').value; $('erro').classList.add('hidden'); $('entrar').disabled=true;
    try{ await carregar(chave); sessionStorage.setItem('ebom_chave',chave); $('login').classList.add('hidden'); $('painel').classList.remove('hidden'); }
    catch(e){ $('erro').textContent=e.message||'Erro ao entrar.'; $('erro').classList.remove('hidden'); }
    finally{ $('entrar').disabled=false; }
  }
  $('entrar').onclick=entrar; $('chave').addEventListener('keydown',e=>{ if(e.key==='Enter') entrar(); });
  $('busca').addEventListener('input',render);
  $('bAtualizar').onclick=async()=>{ try{ await carregar(sessionStorage.getItem('ebom_chave')||''); }catch(e){ alert(e.message); } };
  const dia = ()=>new Date().toISOString().slice(0,10);
  $('bXlsx').onclick=async(e)=>{ e.target.disabled=true; try{ X.baixar(await X.gerarRelatorioXlsx(dados),`EBOM-inscritos-${dia()}.xlsx`);}catch(x){alert(x.message);} e.target.disabled=false; };
  $('bPdf').onclick=async(e)=>{ e.target.disabled=true; try{ (await X.gerarRelatorioPdf(dados)).save(`EBOM-inscritos-${dia()}.pdf`);}catch(x){alert(x.message);} e.target.disabled=false; };
  const salva=sessionStorage.getItem('ebom_chave'); if(salva){ $('chave').value=salva; entrar(); }
})();
</script>
</body>
</html>
